<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プラッツ君 お試し版</title>
<!--
  プラッツ君 お試し版（HTMLファイル1つで動く版）
  ・このファイルをダブルクリックして、Chrome か Edge で開くだけで動きます。
  ・Claude は使いません。決まった返事を返すので、料金はかかりません。
  ・数式表示（KaTeX）はインターネットから読み込みます。
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root {
  --bg: #f3f8ec; --panel: #ffffff; --ink: #2b2b2b; --muted: #6f7568;
  --accent: #5e9f4f; --accent-dark: #437a37; --photo: #e8893a;
  --line: #dde9d2; --me: #fdf1e4; --platz: #edf6e6; --danger: #d9534f;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Meiryo", system-ui, sans-serif;
  font-size: 18px; height: 100vh; display: flex; flex-direction: column;
}
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 20px; background: var(--accent); color: #fff; flex-wrap: wrap;
}
.topbar h1 { margin: 0; font-size: 22px; }
.topbar-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.turn-counter { font-size: 15px; background: rgba(255,255,255,.25); padding: 4px 10px; border-radius: 999px; }
.toggle { font-size: 15px; cursor: pointer; user-select: none; }
.toggle input { transform: scale(1.2); margin-right: 4px; }

.btn { border: none; border-radius: 12px; padding: 10px 16px; font: inherit; font-weight: bold; cursor: pointer; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-next { background: #fff; color: var(--accent-dark); }
.btn-sub { background: #fff; color: var(--ink); border: 2px solid var(--line); font-size: 15px; }
.btn-photo { background: var(--photo); color: #fff; white-space: nowrap; display: inline-flex; align-items: center; }
.btn-send { background: var(--accent); color: #fff; min-width: 80px; }
.btn-send:hover:not(:disabled) { background: var(--accent-dark); }
.btn-mic { background: #fff; border: 2px solid var(--line); font-size: 22px; padding: 6px 12px; }
.btn-mic.listening { background: var(--danger); color: #fff; border-color: var(--danger); animation: pulse 1s infinite; }

.layout { flex: 1; display: grid; grid-template-columns: minmax(260px, 34%) 1fr; gap: 16px; padding: 16px; min-height: 0; }
.stage {
  background: var(--panel); border-radius: 20px; padding: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
}
.bubble {
  position: relative; background: var(--platz); border: 2px solid var(--accent);
  border-radius: 16px; padding: 10px 16px; font-size: 17px; text-align: center;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%);
  border: 10px solid transparent; border-top-color: var(--accent); border-bottom: 0;
}
.platz { width: min(100%, 320px); max-height: 50vh; object-fit: contain; transform-origin: 50% 90%; }
.platz.talking { animation: talk .5s ease-in-out infinite alternate; }   /* 話している：ゆらゆら */
.platz.thinking { animation: think 1.4s ease-in-out infinite; }          /* 考え中：ふわふわ */
.stage-buttons { display: flex; gap: 8px; }
@keyframes talk { from { transform: rotate(-3deg); } to { transform: rotate(3deg) scale(1.03); } }
@keyframes think { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(217,83,79,.5); } 50% { box-shadow: 0 0 0 8px rgba(217,83,79,0); } }

.chat { background: var(--panel); border-radius: 20px; display: flex; flex-direction: column; min-height: 0; }
.log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.empty-hint { margin: auto; color: var(--muted); line-height: 1.8; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.75; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
.msg.platz-msg { align-self: flex-start; background: var(--platz); border-bottom-left-radius: 4px; }
.msg.info { align-self: center; background: #f2f2f2; color: var(--muted); font-size: 16px; }
.msg .who { font-size: 13px; color: var(--muted); font-weight: bold; margin-bottom: 2px; }
.msg img.thumb { display: block; max-width: 240px; max-height: 180px; border-radius: 8px; margin-bottom: 6px; }
.msg .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin: .4em 0; }
.typing::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--accent); }
@keyframes blink { 50% { opacity: 0; } }

.preview { position: relative; margin: 0 16px; align-self: flex-start; }
.preview img { max-height: 120px; max-width: 260px; border-radius: 8px; border: 2px solid var(--photo); display: block; }
.btn-x {
  position: absolute; top: -10px; right: -10px; width: 28px; height: 28px; border-radius: 50%;
  border: none; background: var(--danger); color: #fff; cursor: pointer; font-size: 14px;
}
.composer { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 2px solid var(--line); }
.composer textarea { flex: 1; font: inherit; padding: 10px; border: 2px solid var(--line); border-radius: 12px; resize: none; }
.composer textarea:focus { outline: none; border-color: var(--accent); }
.chat.dragover { outline: 4px dashed var(--photo); outline-offset: -8px; }

@media (max-width: 800px) {
  body { height: auto; min-height: 100vh; }
  .layout { grid-template-columns: 1fr; }
  .platz { max-height: 28vh; }
  .log { min-height: 40vh; }
  .composer { flex-wrap: wrap; }
  .composer textarea { flex-basis: 100%; order: -1; }
}
</style>
</head>
<body>
<header class="topbar">
  <h1>プラッツ君に聞いてみよう（お試し版）</h1>
  <div class="topbar-right">
    <span id="turnCounter" class="turn-counter"></span>
    <label class="toggle"><input type="checkbox" id="voiceToggle" checked> 声で読み上げ</label>
    <button id="nextBtn" class="btn btn-next" type="button">次の問題へ ▶</button>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div class="bubble" id="statusBubble">分からない問題の写真を見せてね！</div>
    <img id="platz" class="platz" alt="プラッツ君">
    <div class="stage-buttons">
      <button id="replayBtn" class="btn btn-sub" type="button" disabled>🔁 もう一度聞く</button>
      <button id="stopBtn" class="btn btn-sub" type="button" disabled>⏹ 止める</button>
    </div>
  </section>

  <section class="chat">
    <div id="log" class="log">
      <div class="empty-hint" id="emptyHint">
        <p>① 「📷 問題の写真」で写真やスクリーンショットを選ぶ<br>（貼り付け・ドラッグでもOK）</p>
        <p>② 分からないところを文字か 🎤 で伝える</p>
        <p>③ 「送る」を押すと、プラッツ君がヒントをくれるよ</p>
        <p style="font-size:15px">※お試し版なので、写真の中身は読まずに例題で練習します</p>
      </div>
    </div>
    <div id="preview" class="preview" hidden>
      <img id="previewImg" alt="選んだ問題の画像">
      <button id="removeImg" class="btn-x" type="button" title="画像を外す">✕</button>
    </div>
    <form id="form" class="composer">
      <label class="btn btn-photo">📷 問題の写真<input id="fileInput" type="file" accept="image/*" hidden></label>
      <textarea id="input" rows="2" placeholder="どこが分からない？（例：(2)の解き方が分からない）"></textarea>
      <button id="micBtn" class="btn btn-mic" type="button" title="声で入力">🎤</button>
      <button id="sendBtn" class="btn btn-send" type="submit">送る</button>
    </form>
  </section>
</main>

<script>
// =====================================================================
// 設定（ここを変えると動きが変わります）
// =====================================================================
const MAX_TURNS = 10; // 1問あたりの最大往復数

const VOICE_SETTINGS = {
  lang: "ja-JP",
  rate: 1.05,  // 話す速さ（0.5〜2）
  pitch: 1.25, // 声の高さ（0〜2）
  // 使いたい声の名前（一部でOK）。上から順に探す
  preferredVoices: ["Google 日本語", "Nanami", "Kyoko", "Haruka", "Ayumi", "Otoya"],
};

// お試し版の返事。1往復目、2往復目…の順に使う。{you} には生徒が送った言葉が入る
const SCRIPT = [
  "{start}ぼくはいま**お試し版**だから、問題の中身はまだ読めないんだ。かわりに例題で練習しよう。\n$$x^2 + 3x - 4 = 0$$\nこの方程式、まず何をすればいいと思う？",
  "「{you}」って考えたんだね。ヒントを出すよ。左側を**因数分解**できないかな？掛けて $-4$、足して $3$ になる2つの数を探してみよう。",
  "いい調子！答えは $4$ と $-1$ だね。だから\n$$x^2 + 3x - 4 = (x + 4)(x - 1)$$\nと書けるよ。じゃあ、$x$ はいくつになるかな？",
  "「{you}」だね。$(x + 4)(x - 1) = 0$ なら、$x + 4 = 0$ か $x - 1 = 0$ のどちらかが成り立つよ。それぞれ解いてみよう！",
  "よくがんばったね！答えは $x = -4,\\ 1$ だよ。自分の力でたどり着けたね。ほかにも気になるところはある？",
];
const AFTER = [
  "「{you}」だね。ぼくはお試し版だから、くわしい答えはまだ出せないんだ。本物の版なら、ここでもっと詳しく説明できるよ。",
  "なるほど、「{you}」かあ。いい質問だね！お試し版では決まった返事しかできないけど、声や動きのテストは続けられるよ。",
];

// =====================================================================
// 読み上げ（ブラウザ標準の音声合成）
// =====================================================================
const speaker = {
  voice: null,
  session: 0,
  onEnd: null,
  supported: "speechSynthesis" in window,
  pickVoice() {
    const voices = speechSynthesis.getVoices().filter((v) => v.lang.replace("_", "-").startsWith("ja"));
    for (const name of VOICE_SETTINGS.preferredVoices) {
      const found = voices.find((v) => v.name.includes(name));
      if (found) return (this.voice = found);
    }
    this.voice = voices[0] || null;
  },
  // 長い文はブラウザによって途中で止まるので、文ごとに区切って話す
  speak(text, { onStart, onEnd } = {}) {
    this.stop();
    if (!this.supported) return onEnd && onEnd();
    const session = ++this.session;
    const sentences = (text.match(/[^。！？!?\n]+[。！？!?]*/g) || []).map((s) => s.trim()).filter(Boolean);
    if (!sentences.length) return onEnd && onEnd();
    this.onEnd = onEnd;
    onStart && onStart();
    sentences.forEach((sentence, i) => {
      const u = new SpeechSynthesisUtterance(sentence);
      u.lang = VOICE_SETTINGS.lang;
      u.rate = VOICE_SETTINGS.rate;
      u.pitch = VOICE_SETTINGS.pitch;
      if (this.voice) u.voice = this.voice;
      if (i === sentences.length - 1) u.onend = u.onerror = () => { if (session === this.session) this.finish(); };
      speechSynthesis.speak(u);
    });
  },
  stop() {
    if (!this.supported) return;
    this.session++;
    speechSynthesis.cancel();
    this.finish();
  },
  finish() {
    const cb = this.onEnd;
    this.onEnd = null;
    cb && cb();
  },
};
if (speaker.supported) {
  speaker.pickVoice();
  speechSynthesis.addEventListener("voiceschanged", () => speaker.pickVoice());
}

// 読み上げ用に、記号や数式を話し言葉に直す
const WORDS = {
  "\\times": " かける ", "\\div": " わる ", "\\cdot": " かける ", "\\pm": " プラスマイナス ",
  "\\leqq": " 小なりイコール ", "\\geqq": " 大なりイコール ", "\\leq": " 小なりイコール ",
  "\\geq": " 大なりイコール ", "\\le": " 小なりイコール ", "\\ge": " 大なりイコール ",
  "\\neq": " ノットイコール ", "\\approx": " ニアリーイコール ", "\\infty": "無限大",
  "\\pi": "パイ", "\\theta": "シータ", "\\alpha": "アルファ", "\\beta": "ベータ",
  "\\sin": "サイン", "\\cos": "コサイン", "\\tan": "タンジェント", "\\log": "ログ",
  "\\sum": "シグマ", "\\int": "インテグラル", "\\angle": "角", "\\triangle": "三角形",
  "\\Rightarrow": " ならば ", "\\circ": "度",
};
function mathToSpeech(tex) {
  let s = tex;
  for (let i = 0; i < 5; i++) {
    s = s
      .replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, " $2 分の $1 ")
      .replace(/\\sqrt\{([^{}]*)\}/g, " ルート $1 ")
      .replace(/\^\{?\\circ\}?/g, "度")
      .replace(/\\(int|sum)_\{?([^{}^\s]+)\}?\^\{?([^{}\s]+)\}?/g, " \\$1 $2 から $3 まで ")
      .replace(/\^\{2\}|\^2/g, " の2乗 ")
      .replace(/\^\{3\}|\^3/g, " の3乗 ")
      .replace(/\^\{([^{}]*)\}/g, " の $1 乗 ")
      .replace(/\^(\w)/g, " の $1 乗 ");
  }
  for (const k of Object.keys(WORDS).sort((a, b) => b.length - a.length)) s = s.split(k).join(WORDS[k]);
  return s
    .replace(/\\left|\\right|\\,|\\;|\\!|\\quad|\\ /g, " ")
    .replace(/_\{([^{}]*)\}|_(\w)/g, " $1$2 ")
    .replace(/\\[a-zA-Z]+/g, " ")
    .replace(/[{}]/g, " ")
    .replace(/</g, " 小なり ").replace(/>/g, " 大なり ")
    .replace(/=/g, " イコール ").replace(/\+/g, " プラス ").replace(/[-−]/g, " マイナス ")
    .replace(/\s+/g, " ").trim();
}
function toSpeechText(text) {
  return text
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => ` ${mathToSpeech(t)} 。`)
    .replace(/\$([^$\n]+?)\$/g, (_, t) => ` ${mathToSpeech(t)} `)
    .replace(/[*_`#>]/g, "")
    .trim();
}

// =====================================================================
// 文字の表示（**太字** と 数式 $...$ / $$...$$ に対応）
// =====================================================================
const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function mathHtml(tex, display) {
  if (!window.katex) return escapeHtml(display ? `$$${tex}$$` : `$${tex}$`); // ネットにつながらないときはそのまま表示
  return katex.renderToString(tex, { displayMode: display, throwOnError: false });
}
function renderRich(el, text) {
  el.innerHTML = text
    .replace(/\n?(\$\$[\s\S]+?\$\$)\n?/g, "$1") // 独立した式の前後の改行は不要（式が自分で改行する）
    .split(/(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$)/g)
    .map((part) => {
      if (part.startsWith("$$") && part.endsWith("$$") && part.length > 4) return mathHtml(part.slice(2, -2), true);
      if (part.startsWith("$") && part.endsWith("$") && part.length > 2) return mathHtml(part.slice(1, -1), false);
      return escapeHtml(part).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
    })
    .join("");
}

// =====================================================================
// 画面の動き
// =====================================================================
const $ = (id) => document.getElementById(id);
const els = {
  log: $("log"), emptyHint: $("emptyHint"), form: $("form"), input: $("input"),
  fileInput: $("fileInput"), preview: $("preview"), previewImg: $("previewImg"), removeImg: $("removeImg"),
  micBtn: $("micBtn"), sendBtn: $("sendBtn"), nextBtn: $("nextBtn"), replayBtn: $("replayBtn"),
  stopBtn: $("stopBtn"), voiceToggle: $("voiceToggle"), platz: $("platz"), status: $("statusBubble"),
  turnCounter: $("turnCounter"), chat: document.querySelector(".chat"),
};

let turns = 0;
let pendingImage = null;
let busy = false;
let lastSpoken = "";
let replyTimer = null;

function setMood(mood, text) {
  els.platz.classList.toggle("talking", mood === "talking");
  els.platz.classList.toggle("thinking", mood === "thinking");
  if (text) els.status.textContent = text;
}

function speak(text) {
  lastSpoken = text;
  els.replayBtn.disabled = !text;
  if (!els.voiceToggle.checked || !text) return setMood("idle", "考えたことを教えてね！");
  speaker.speak(toSpeechText(text), {
    onStart: () => { setMood("talking", "おはなし中…"); els.stopBtn.disabled = false; },
    onEnd: () => {
      setMood("idle", turns < MAX_TURNS ? "考えたことを教えてね！" : "よくがんばったね！");
      els.stopBtn.disabled = true;
    },
  });
}

function updateTurns() {
  els.turnCounter.textContent = `この問題であと ${MAX_TURNS - turns} 回 質問できるよ`;
  const locked = busy || turns >= MAX_TURNS;
  els.sendBtn.disabled = locked;
  els.input.disabled = turns >= MAX_TURNS;
  els.micBtn.disabled = locked || !listener;
}

function addBubble(kind, { text = "", imageUrl = null } = {}) {
  els.emptyHint.hidden = true;
  const div = document.createElement("div");
  div.className = `msg ${kind}`;
  if (kind === "platz-msg") {
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = "プラッツ君";
    div.append(who);
  }
  if (imageUrl) {
    const img = document.createElement("img");
    img.className = "thumb";
    img.src = imageUrl;
    div.append(img);
  }
  const body = document.createElement("div");
  body.textContent = text;
  div.append(body);
  els.log.append(div);
  els.log.scrollTop = els.log.scrollHeight;
  return body;
}

// ---------- 画像 ----------
function loadImage(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = () => {
    pendingImage = reader.result;
    els.previewImg.src = pendingImage;
    els.preview.hidden = false;
    setMood("idle", "写真を受け取ったよ！どこが分からないか教えてね。");
    els.input.focus();
  };
  reader.readAsDataURL(file);
}
function clearImage() {
  pendingImage = null;
  els.preview.hidden = true;
  els.previewImg.removeAttribute("src");
  els.fileInput.value = "";
}
els.fileInput.addEventListener("change", () => loadImage(els.fileInput.files[0]));
els.removeImg.addEventListener("click", clearImage);
document.addEventListener("paste", (e) => {
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find((i) => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); loadImage(item.getAsFile()); }
});
els.chat.addEventListener("dragover", (e) => { e.preventDefault(); els.chat.classList.add("dragover"); });
els.chat.addEventListener("dragleave", () => els.chat.classList.remove("dragover"));
els.chat.addEventListener("drop", (e) => {
  e.preventDefault();
  els.chat.classList.remove("dragover");
  loadImage(e.dataTransfer.files[0]);
});

// ---------- 音声入力（Chrome / Edge） ----------
let listener = null;
let listening = false;
let textBeforeMic = "";
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  listener = new SR();
  listener.lang = "ja-JP";
  listener.interimResults = true;
  listener.continuous = false;
  listener.onresult = (e) => {
    let text = "";
    for (const r of e.results) text += r[0].transcript;
    els.input.value = (textBeforeMic ? textBeforeMic + " " : "") + text;
  };
  listener.onstart = () => {
    listening = true;
    els.micBtn.classList.add("listening");
    els.micBtn.textContent = "■";
    setMood("idle", "聞いてるよ…話し終わったら、もう一度ボタンを押してね");
  };
  listener.onend = () => {
    listening = false;
    els.micBtn.classList.remove("listening");
    els.micBtn.textContent = "🎤";
    if (!busy) setMood("idle", "送るボタンを押してね！");
  };
  listener.onerror = (e) => {
    if (e.error === "not-allowed") alert("マイクの使用が許可されていません。アドレスバーのマイクのマークから許可してください。");
  };
} else {
  els.micBtn.title = "このブラウザは音声入力に対応していません（Chrome か Edge を使ってください）";
}
els.micBtn.addEventListener("click", () => {
  if (!listener) return;
  if (listening) return listener.stop();
  speaker.stop(); // プラッツ君の声を拾わないように止める
  textBeforeMic = els.input.value.trim();
  listener.start();
});

// ---------- 送信 ----------
els.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    els.form.requestSubmit();
  }
});

els.form.addEventListener("submit", (e) => {
  e.preventDefault();
  if (busy || turns >= MAX_TURNS) return;
  const text = els.input.value.trim();
  if (!text && !pendingImage) return setMood("idle", "問題の写真か、質問を入れてね！");

  if (listening) listener.stop();
  speaker.stop();
  const hadImage = Boolean(pendingImage);
  addBubble("me", { text: text || "この問題を教えて！", imageUrl: pendingImage });
  els.input.value = "";
  clearImage();
  turns++;
  reply(text, hadImage);
});

// 決まった返事を「考え中 → 少しずつ表示 → 読み上げ」の順で出す
function reply(you, hadImage) {
  busy = true;
  updateTurns();
  setMood("thinking", "うーん、考え中…");

  const template = turns <= SCRIPT.length ? SCRIPT[turns - 1] : AFTER[(turns - SCRIPT.length - 1) % AFTER.length];
  const text = template
    .replace("{start}", hadImage ? "写真を受け取ったよ！" : "質問を受け取ったよ！")
    .replaceAll("{you}", (you || "この問題を教えて").slice(0, 40));
  const chunks = text.match(/\$\$[\s\S]+?\$\$|\$[^$]+\$|[\s\S]{1,3}/g);

  const body = addBubble("platz-msg");
  body.classList.add("typing");
  let shown = "";
  let i = 0;
  replyTimer = setTimeout(function step() {
    if (i < chunks.length) {
      shown += chunks[i++];
      renderRich(body, shown);
      els.log.scrollTop = els.log.scrollHeight;
      replyTimer = setTimeout(step, 35);
      return;
    }
    body.classList.remove("typing");
    busy = false;
    updateTurns();
    if (turns >= MAX_TURNS) addBubble("info", { text: `この問題のやり取りは${MAX_TURNS}回までだよ。「次の問題へ」を押してね。` });
    speak(text);
  }, 1200);
}

// ---------- ボタン ----------
els.nextBtn.addEventListener("click", () => {
  if (turns && !confirm("今の問題の会話を消して、次の問題に進みますか？")) return;
  clearTimeout(replyTimer);
  speaker.stop();
  if (listening) listener.stop();
  turns = 0;
  busy = false;
  lastSpoken = "";
  clearImage();
  els.input.value = "";
  els.log.querySelectorAll(".msg").forEach((m) => m.remove());
  els.emptyHint.hidden = false;
  els.replayBtn.disabled = true;
  setMood("idle", "次の問題の写真を見せてね！");
  updateTurns();
});
els.replayBtn.addEventListener("click", () => speak(lastSpoken));
els.stopBtn.addEventListener("click", () => speaker.stop());
els.voiceToggle.addEventListener("change", () => { if (!els.voiceToggle.checked) speaker.stop(); });

updateTurns();
</script>
