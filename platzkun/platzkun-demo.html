<!doctype html>
<html lang="ja">
<head>
<!--
  プラッツ君 お試し版（HTMLファイル1つで動く版）… このファイルは tools/build-demo.mjs で自動で作っています
  ・ダブルクリックして、Chrome か Edge で開くだけで動きます。
  ・Claude は使いません。決まった返事を返すので、料金はかかりません。
  ・「例題でためしてみる」を押すと、問題の写真の上に「いま話している場所」の枠が出ます。
  ・数式表示などの部品はインターネットから読み込みます。
-->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プラッツ君 お試し版</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css">
  <style>
:root {
  --bg: #f3f8ec;
  --panel: #ffffff;
  --ink: #2b2b2b;
  --muted: #6f7568;
  --accent: #5e9f4f; /* プラッツ君の緑 */
  --accent-dark: #437a37;
  --teal: #e8893a; /* 写真ボタンは目立つようにオレンジ */
  --line: #dde9d2;
  --me: #fdf1e4;
  --platz: #edf6e6;
  --danger: #d9534f;
  --hl: rgba(255, 205, 40, .30); /* 蛍光ペンの黄色 */
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Meiryo", system-ui, sans-serif;
  font-size: 18px;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- 上のバー ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 20px;
  background: var(--accent);
  color: #fff;
  flex-wrap: wrap;
}
.topbar h1 { margin: 0; font-size: 22px; }
.topbar-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.turn-counter { font-size: 15px; background: rgba(255,255,255,.25); padding: 4px 10px; border-radius: 999px; }
.toggle { font-size: 15px; cursor: pointer; user-select: none; }
.toggle input { transform: scale(1.2); margin-right: 4px; }

/* ---------- ボタン ---------- */
.btn {
  border: none;
  border-radius: 12px;
  padding: 10px 16px;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
  transition: transform .05s, background .2s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-next { background: #fff; color: var(--accent-dark); }
.btn-sub { background: #fff; color: var(--ink); border: 2px solid var(--line); font-size: 15px; }
.btn-photo { background: var(--teal); color: #fff; white-space: nowrap; display: inline-flex; align-items: center; }
.btn-send { background: var(--accent); color: #fff; min-width: 80px; }
.btn-send:hover:not(:disabled) { background: var(--accent-dark); }
.btn-mic { background: #fff; border: 2px solid var(--line); font-size: 22px; padding: 6px 12px; }
.btn-mic.listening { background: var(--danger); color: #fff; border-color: var(--danger); animation: pulse 1s infinite; }

/* ---------- 全体のレイアウト ---------- */
.layout {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(340px, 1fr);
  gap: 16px;
  padding: 16px;
  min-height: 0;
}

/* ---------- プラッツ君 ---------- */
.stage {
  background: var(--panel);
  border-radius: 20px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
.bubble {
  position: relative;
  background: var(--platz);
  border: 2px solid var(--accent);
  border-radius: 16px;
  padding: 10px 16px;
  font-size: 17px;
  max-width: 100%;
  text-align: center;
}
.bubble::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -12px;
  transform: translateX(-50%);
  border: 10px solid transparent;
  border-top-color: var(--accent);
  border-bottom: 0;
}
.platz {
  width: min(100%, 320px);
  max-height: 50vh;
  object-fit: contain;
  transform-origin: 50% 90%;
}
/* 話しているあいだ：左右にゆらゆら */
.platz.talking { animation: talk .5s ease-in-out infinite alternate; }
/* 考えているあいだ：上下にふわふわ */
.platz.thinking { animation: think 1.4s ease-in-out infinite; }
.stage-buttons { display: flex; gap: 8px; }

@keyframes talk {
  from { transform: rotate(-3deg) scale(1); }
  to   { transform: rotate(3deg) scale(1.03); }
}
@keyframes think {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(217,83,79,.5); }
  50%      { box-shadow: 0 0 0 8px rgba(217,83,79,0); }
}

/* ---------- 左の列：問題が来たら、プラッツ君は小さく上に、問題の写真を大きく ---------- */
.left { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.left .stage { flex: 1; }
.left.has-problem .stage { flex: 0 0 auto; flex-direction: row; justify-content: flex-start; padding: 10px 16px; }
.left.has-problem .platz { order: -1; width: 100px; }
.left.has-problem .bubble { flex: 1; text-align: left; }
.left.has-problem .bubble::after {
  left: -12px; top: 50%; bottom: auto; transform: translateY(-50%);
  border: 10px solid transparent; border-right-color: var(--accent); border-left: 0;
}
.left.has-problem .stage-buttons { flex-direction: column; }
.board {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--panel); border-radius: 20px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
.board-view {
  flex: 1; min-height: 0; position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; padding: 10px;
}
.frame { position: relative; transition: transform .45s ease; }
.frame img { display: block; width: 100%; height: 100%; border-radius: 6px; }
.mark {
  position: absolute; border: 3px solid var(--teal); background: var(--hl);
  border-radius: 6px; animation: pop .5s ease-out; pointer-events: none;
}
.mark span {
  position: absolute; left: -3px; bottom: 100%; margin-bottom: 2px;
  background: var(--teal); color: #fff; font-size: 13px; font-weight: bold;
  padding: 1px 8px; border-radius: 8px 8px 8px 0; white-space: nowrap;
}
@keyframes pop { from { transform: scale(1.25); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.board-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 8px 12px; border-top: 2px solid var(--line); font-size: 14px; color: var(--muted);
}
.board-bar .key { display: inline-flex; align-items: center; gap: 6px; }
.board-bar .key i { width: 18px; height: 12px; border: 2px solid var(--teal); background: var(--hl); border-radius: 3px; }
.board-btns { display: flex; gap: 6px; }
.board-btns .btn { padding: 6px 10px; font-size: 14px; }
.pin { margin-top: 6px; padding: 4px 10px; font-size: 13px; background: #fff; border: 2px solid var(--line); }
.credit { margin: 0; font-size: 12px; color: var(--muted); text-align: right; }
.btn-sample { background: var(--accent); color: #fff; }

/* ---------- 会話 ---------- */
.chat {
  background: var(--panel);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
.log {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.empty-hint {
  margin: auto;
  color: var(--muted);
  line-height: 1.8;
  text-align: left;
}
.msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 16px;
  line-height: 1.75;
  overflow-wrap: anywhere;
}
.msg p { margin: 0 0 .5em; }
.msg p:last-child { margin-bottom: 0; }
.msg.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
.msg.platz-msg { align-self: flex-start; background: var(--platz); border-bottom-left-radius: 4px; }
.msg.error { align-self: center; background: #fdecea; color: var(--danger); font-size: 16px; }
.msg.info { align-self: center; background: #f2f2f2; color: var(--muted); font-size: 16px; }
.msg .who { font-size: 13px; color: var(--muted); font-weight: bold; margin-bottom: 2px; }
.msg img.thumb { display: block; max-width: 240px; max-height: 180px; border-radius: 8px; margin-bottom: 6px; }
.msg .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.typing::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--accent); }
@keyframes blink { 50% { opacity: 0; } }

.preview {
  position: relative;
  margin: 0 16px;
  align-self: flex-start;
}
.preview img { max-height: 120px; max-width: 260px; border-radius: 8px; border: 2px solid var(--teal); display: block; }
.btn-x {
  position: absolute; top: -10px; right: -10px;
  width: 28px; height: 28px; border-radius: 50%;
  border: none; background: var(--danger); color: #fff; cursor: pointer; font-size: 14px;
}

.composer {
  display: flex;
  gap: 8px;
  padding: 12px 16px 16px;
  align-items: stretch;
  border-top: 2px solid var(--line);
}
.composer textarea {
  flex: 1;
  font: inherit;
  padding: 10px;
  border: 2px solid var(--line);
  border-radius: 12px;
  resize: none;
}
.composer textarea:focus { outline: none; border-color: var(--accent); }

.chat.dragover { outline: 4px dashed var(--teal); outline-offset: -8px; }

/* 画面が狭いとき（タブレット縦など）は上下に並べる */
@media (prefers-reduced-motion: reduce) {
  .platz.talking, .platz.thinking, .mark { animation: none; }
  .frame { transition: none; }
}

@media (max-width: 800px) {
  body { height: auto; min-height: 100vh; }
  .layout { grid-template-columns: 1fr; }
  .board { height: 50vh; flex: none; }
  .left.has-problem .stage-buttons { flex-direction: row; }
  .platz { max-height: 28vh; }
  .log { min-height: 40vh; }
  .composer { flex-wrap: wrap; }
  .composer textarea { flex-basis: 100%; order: -1; }
}
</style>
</head>

async function streamDemoReply(messages, send, { sampleProblem = false } = {}) {
  const userMessages = messages.filter((m) => m.role === "user");
  const turn = userMessages.length;
  const last = userMessages.at(-1);
  const parts = Array.isArray(last.content) ? last.content : [{ type: "text", text: String(last.content) }];
  const you = (parts.find((p) => p.type === "text")?.text || "").split("\n")[0].slice(0, 40);
  const hasImage = parts.some((p) => p.type === "image");

  let text;
  if (turn <= SCRIPT.length) {
    const step = SCRIPT[turn - 1];
    text = step.text({ hasImage, sample: sampleProblem });
    if (sampleProblem) text += "\n" + step.mark; // 枠はサンプル問題のときだけ（ほかの写真では場所が分からないため）
  } else {
    text = AFTER[(turn - SCRIPT.length - 1) % AFTER.length];
  }
  text = text.replaceAll("{you}", you);

  await sleep(1200); // 考えているふり
  // 数式や目印の途中で区切らないように、ひとかたまりで送る
  for (const chunk of text.match(/\[\[[^\]]*\]\]|\$\$[\s\S]+?\$\$|\$[^$]+\$|[\s\S]{1,3}/g)) {
    send({ type: "text", text: chunk });
    await sleep(35);
  }
  send({ type: "done", content: [{ type: "text", text }] });
}

// ---- public/render.js ----
// 解説文（Markdown + 数式）を画面用の HTML に変える



marked.setOptions({ breaks: true });

// 数式を一度「目印」に置きかえてから Markdown を処理し、最後に KaTeX で描き戻す
// （先に Markdown を通すと、数式の _ や \ がこわれてしまうため）
function renderRich(el, source) {
  const maths = [];
  const keep = (tex, display) => {
    maths.push({ tex, display });
    return `@@MATH${maths.length - 1}@@`;
  };

  const text = source
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true))
    .replace(/\\\[([\s\S]+?)\\\]/g, (_, t) => keep(t, true))
    .replace(/\\\(([\s\S]+?)\\\)/g, (_, t) => keep(t, false))
    .replace(/\$([^$\n]+?)\$/g, (_, t) => keep(t, false));

  const html = DOMPurify.sanitize(marked.parse(text)).replace(/@@MATH(\d+)@@/g, (_, i) => {
    const m = maths[Number(i)];
    return katex.renderToString(m.tex, { displayMode: m.display, throwOnError: false });
  });

  el.innerHTML = html;
}

// ---- public/voice.js ----
// 音声まわり（読み上げ と 音声入力）
//
// ■ 読み上げの声
//   塾のパソコンで VOICEVOX（無料の読み上げソフト）が起動していれば、その声（VoicevoxSpeaker）で、
//   起動していなければブラウザ標準の声（BrowserSpeaker）で読み上げます。
//   別の音声エンジンに替えるときは、同じ形（speak(text, { onStart, onEnd }) と stop()）を持つクラスを作り、
//   いちばん下の createSpeaker() でそれを返すようにするだけで、ほかのファイルは変更不要です。

// ブラウザ標準の声の設定。好みに合わせて変更してください
const VOICE_SETTINGS = {
  lang: "ja-JP",
  rate: 1.05, // 話す速さ（0.5〜2）
  pitch: 1.15, // 声の高さ（0〜2）
  // 使いたい声の名前（一部でOK）。上から順に探して、見つかったものを使う。Edge の「Natural」の声がいちばん自然
  preferredVoices: ["Nanami Online (Natural)", "Natural", "Google 日本語", "Nanami", "Kyoko", "Haruka", "Ayumi", "Otoya"],
};

// 文に区切ってから、maxLen 字くらいまでまとめる（1文ずつだと、文の間が途切れて聞こえるため）
function splitForSpeech(text, maxLen) {
  const sentences = text.match(/[^。！？!?\n]+[。！？!?]*/g)?.map((s) => s.trim()).filter(Boolean) ?? [];
  const parts = [];
  for (const s of sentences) {
    if (parts.length && (parts.at(-1) + s).length <= maxLen) parts[parts.length - 1] += s;
    else parts.push(s);
  }
  return parts;
}

class BrowserSpeaker {
  constructor(settings = VOICE_SETTINGS) {
    this.settings = settings;
    this.voice = null;
    this.session = 0;
    this.label = "ブラウザ標準の声";
    if ("speechSynthesis" in window) {
      this.pickVoice();
      speechSynthesis.addEventListener("voiceschanged", () => this.pickVoice());
    }
  }

  get supported() {
    return "speechSynthesis" in window;
  }

  pickVoice() {
    const voices = speechSynthesis.getVoices().filter((v) => v.lang.replace("_", "-").startsWith("ja"));
    for (const name of this.settings.preferredVoices) {
      const found = voices.find((v) => v.name.includes(name));
      if (found) return (this.voice = found);
    }
    this.voice = voices[0] || null;
  }

  // 長すぎる文をまとめて渡すと途中で止まるブラウザがあるので、100字くらいずつ順番に話す
  speak(text, { onStart, onEnd } = {}) {
    this.stop();
    if (!this.supported) return onEnd?.();
    const session = ++this.session;
    const parts = splitForSpeech(text, 100);
    if (parts.length === 0) return onEnd?.();

    this.onEnd = onEnd;
    onStart?.();
    parts.forEach((part, i) => {
      const u = new SpeechSynthesisUtterance(part);
      u.lang = this.settings.lang;
      u.rate = this.settings.rate;
      u.pitch = this.settings.pitch;
      if (this.voice) u.voice = this.voice;
      if (i === parts.length - 1) {
        u.onend = u.onerror = () => {
          if (session === this.session) this.finish();
        };
      }
      speechSynthesis.speak(u);
    });
  }

  stop() {
    if (!this.supported) return;
    this.session++;
    speechSynthesis.cancel();
    this.finish();
  }

  // 話し終わりの合図は1回だけ出す
  finish() {
    const cb = this.onEnd;
    this.onEnd = null;
    cb?.();
  }
}

// VOICEVOX の声（サーバーの /api/tts 経由）。
// 1つ目を話している間に次の文の音声を作っておくので、文と文の間が空きにくい
class VoicevoxSpeaker {
  constructor(name) {
    this.label = `VOICEVOX:${name}`;
    this.session = 0;
    this.audio = new Audio();
    this.onEnd = null;
  }

  async synth(text) {
    const res = await fetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error("tts failed");
    return URL.createObjectURL(await res.blob());
  }

  async speak(text, { onStart, onEnd } = {}) {
    this.stop();
    const session = ++this.session;
    const parts = splitForSpeech(text, 60);
    if (parts.length === 0) return onEnd?.();
    this.onEnd = onEnd;

    let next = this.synth(parts[0]);
    let started = false;
    try {
      for (let i = 0; i < parts.length; i++) {
        const url = await next;
        if (session !== this.session) return URL.revokeObjectURL(url);
        if (i + 1 < parts.length) next = this.synth(parts[i + 1]); // 次の文を先に作っておく
        if (!started) {
          started = true;
          onStart?.();
        }
        await this.play(url);
        URL.revokeObjectURL(url);
        if (session !== this.session) return;
      }
    } catch {
      // VOICEVOX が途中で止まったときは、残りをあきらめて終わる
    }
    if (session === this.session) this.finish();
  }

  play(url) {
    return new Promise((resolve) => {
      this.audio.onended = this.audio.onerror = this.audio.onpause = () => resolve();
      this.audio.src = url;
      this.audio.play().catch(resolve);
    });
  }

  stop() {
    this.session++;
    this.audio.pause();
    this.finish();
  }

  finish() {
    const cb = this.onEnd;
    this.onEnd = null;
    cb?.();
  }
}

// VOICEVOX が使えればその声、だめならブラウザ標準の声
async function createSpeaker() {
  try {
    const res = await fetch("/api/tts/status");
    const status = await res.json();
    if (status.voicevox) return new VoicevoxSpeaker(status.name);
  } catch {
    // サーバーに聞けないときはブラウザの声
  }
  return new BrowserSpeaker();
}

// ---------------------------------------------------------------
// 読み上げ用に、Markdown の記号や数式を「話し言葉」に直す
// ---------------------------------------------------------------
function toSpeechText(markdown) {
  return markdown
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => ` ${mathToSpeech(t)} `)
    .replace(/\\\[([\s\S]+?)\\\]/g, (_, t) => ` ${mathToSpeech(t)} `)
    .replace(/\\\(([\s\S]+?)\\\)/g, (_, t) => ` ${mathToSpeech(t)} `)
    .replace(/\$([^$\n]+?)\$/g, (_, t) => ` ${mathToSpeech(t)} `)
    .replace(/```[\s\S]*?```/g, "")
    .replace(/[*_`#>|]/g, "")
    .replace(/^\s*[-・]\s+/gm, "")
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
    .replace(/[ \t]+/g, " ")
    .trim();
}

const WORDS = {
  "\\times": " かける ", "\\div": " わる ", "\\cdot": " かける ", "\\pm": " プラスマイナス ",
  "\\leqq": " 小なりイコール ", "\\geqq": " 大なりイコール ", "\\leq": " 小なりイコール ",
  "\\geq": " 大なりイコール ", "\\le": " 小なりイコール ", "\\ge": " 大なりイコール ",
  "\\neq": " ノットイコール ", "\\fallingdotseq": " ニアリーイコール ", "\\approx": " ニアリーイコール ",
  "\\infty": "無限大", "\\pi": "パイ", "\\theta": "シータ", "\\alpha": "アルファ", "\\beta": "ベータ",
  "\\gamma": "ガンマ", "\\omega": "オメガ", "\\lambda": "ラムダ", "\\mu": "ミュー", "\\sigma": "シグマ",
  "\\Delta": "デルタ", "\\sin": "サイン", "\\cos": "コサイン", "\\tan": "タンジェント",
  "\\log": "ログ", "\\lim": "リミット", "\\sum": "シグマ", "\\int": "インテグラル",
  "\\angle": "角", "\\triangle": "三角形", "\\perp": " 垂直 ", "\\parallel": " 平行 ",
  "\\to": " から ", "\\rightarrow": " ならば ", "\\Rightarrow": " ならば ", "\\therefore": "よって",
  "\\circ": "度", "\\%": "パーセント",
};

function mathToSpeech(tex) {
  let s = tex;
  // 分数・ルートは中から順にほどく（入れ子に対応）
  for (let i = 0; i < 5; i++) {
    s = s
      .replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, " $2 分の $1 ")
      .replace(/\\sqrt\[([^\]]*)\]\{([^{}]*)\}/g, " $1 乗根 $2 ")
      .replace(/\\sqrt\{([^{}]*)\}/g, " ルート $1 ")
      .replace(/\^\{?\\circ\}?/g, "度")
      .replace(/\\(int|sum)_\{?([^{}^\s]+)\}?\^\{?([^{}\s]+)\}?/g, " \\$1 $2 から $3 まで ")
      .replace(/\^\{2\}|\^2/g, " の2乗 ")
      .replace(/\^\{3\}|\^3/g, " の3乗 ")
      .replace(/\^\{([^{}]*)\}/g, " の $1 乗 ")
      .replace(/\^(\w)/g, " の $1 乗 ")
      .replace(/\\(?:text|mathrm|mathbf|vec|overline|boldsymbol)\{([^{}]*)\}/g, " $1 ");
  }
  const keys = Object.keys(WORDS).sort((a, b) => b.length - a.length);
  for (const k of keys) s = s.split(k).join(WORDS[k]);
  return s
    .replace(/\\left|\\right|\\,|\\;|\\!|\\quad|\\qquad/g, " ")
    .replace(/_\{([^{}]*)\}|_(\w)/g, " $1$2 ")
    .replace(/\\[a-zA-Z]+/g, " ")
    .replace(/[{}]/g, " ")
    .replace(/<=|≦/g, " 小なりイコール ")
    .replace(/>=|≧/g, " 大なりイコール ")
    .replace(/</g, " 小なり ")
    .replace(/>/g, " 大なり ")
    .replace(/=/g, " イコール ")
    .replace(/\+/g, " プラス ")
    .replace(/[-−]/g, " マイナス ")
    .replace(/\//g, " 割る ")
    .replace(/\s+/g, " ")
    .trim();
}

// ---------------------------------------------------------------
// 音声入力（Web Speech API の SpeechRecognition）
// Chrome / Edge で使えます。Safari・Firefox では使えないことがあります。
// ---------------------------------------------------------------
class Listener {
  // onText(text)  … 聞き取り中の文字（途中も含む）
  // onFinal(text) … 話し終わって確定した文字
  // onState(on, heard) … 聞き取りの開始/終了。終了時の heard は、何か聞き取れたかどうか
  constructor({ lang = "ja-JP", onText, onFinal, onState, onDenied } = {}) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    this.supported = Boolean(SR);
    this.listening = false;
    if (!SR) return;

    this.rec = new SR();
    this.rec.lang = lang;
    this.rec.interimResults = true;
    this.rec.continuous = false;
    this.heard = "";

    this.rec.onresult = (e) => {
      let text = "";
      for (const r of e.results) text += r[0].transcript;
      this.heard = text;
      onText?.(text);
      if (e.results[e.results.length - 1].isFinal) onFinal?.(text);
    };
    this.rec.onstart = () => {
      this.listening = true;
      this.heard = "";
      onState?.(true, false);
    };
    this.rec.onend = () => {
      this.listening = false;
      onState?.(false, Boolean(this.heard.trim()));
    };
    this.rec.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") onDenied?.();
    };
  }

  start() {
    if (!this.supported || this.listening) return;
    try {
      this.rec.start();
    } catch {
      // すでに聞き取り中
    }
  }

  toggle() {
    if (this.listening) this.rec.stop();
    else this.start();
  }

  stop() {
    if (this.listening) this.rec.stop();
  }
}

// ---------- 画像の読み込み ----------
// Claude が縮めずにそのまま見る大きさ（約115万画素・長い辺1568px以内）にしておき、
// その大きさを、枠の座標の基準にする
const MAX_PIXELS = 1150000;
const MAX_SIDE = 1568;

async function loadImage(file, { sample = false } = {}) {
  if (!file || !file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.src = url;
  await img.decode();

  const scale = Math.min(
    1,
    MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight),
    Math.sqrt(MAX_PIXELS / (img.naturalWidth * img.naturalHeight)),
  );
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(img.naturalWidth * scale);
  canvas.height = Math.round(img.naturalHeight * scale);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; // 透明な背景（スクショ等）は白にする
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  URL.revokeObjectURL(url);

  const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
  pendingImage = {
    mediaType: "image/jpeg",
    data: dataUrl.split(",")[1],
    url: dataUrl,
    w: canvas.width,
    h: canvas.height,
    sample,
  };
  els.previewImg.src = dataUrl;
  els.preview.hidden = false;
  setMood("idle", "写真を受け取ったよ！どこが分からないか教えてね。");
  els.input.focus();
}

function clearImage() {
  pendingImage = null;
  els.preview.hidden = true;
  els.previewImg.removeAttribute("src");
  els.fileInput.value = "";
}

els.fileInput.addEventListener("change", () => loadImage(els.fileInput.files[0]));

// ---------- 問題の写真（大きく表示して、話している場所に枠） ----------
let currentMarks = []; // [{x, y, w, h}]（写真のピクセル）
let zoomed = false;
let fitScale = 1;

function showProblem(img) {
  problemImage = img;
  els.boardImg.src = img.url;
  els.board.hidden = false;
  els.left.classList.add("has-problem");

// 写真を、枠の中いっぱいに収める
function fitBoard() {
  if (!problemImage || els.board.hidden) return;
  const vw = Math.max(40, els.boardView.clientWidth - 20);
  const vh = Math.max(40, els.boardView.clientHeight - 20);
  fitScale = Math.min(vw / problemImage.w, vh / problemImage.h);
  els.frame.style.width = `${problemImage.w * fitScale}px`;
  els.frame.style.height = `${problemImage.h * fitScale}px`;
  applyZoom();
}
new ResizeObserver(fitBoard).observe(els.boardView);

function drawMarks() {
  els.frame.querySelectorAll(".mark").forEach((m) => m.remove());
  if (problemImage) {
    currentMarks.forEach((m, i) => {
      const box = document.createElement("div");
      box.className = "mark";
      box.style.left = `${(m.x / problemImage.w) * 100}%`;
      box.style.top = `${(m.y / problemImage.h) * 100}%`;
      box.style.width = `${(m.w / problemImage.w) * 100}%`;
      box.style.height = `${(m.h / problemImage.h) * 100}%`;
      const label = document.createElement("span");
      label.textContent = currentMarks.length > 1 ? `ここ ${i + 1}` : "ここ！";
      box.append(label);
      els.frame.append(box);
    });
  }
  els.zoomBtn.disabled = !currentMarks.length;
  els.clearMarkBtn.disabled = !currentMarks.length;
  if (!currentMarks.length) zoomed = false;
  applyZoom();
}

// 枠の所を拡大：枠の真ん中が表示の真ん中に来るように、写真を拡大してずらす
function applyZoom() {
  els.zoomBtn.textContent = zoomed ? "全体を見る" : "枠の所を拡大";
  if (!zoomed || !currentMarks.length || !problemImage) {
    els.frame.style.transform = "";
    return;
  }
  const x1 = Math.min(...currentMarks.map((m) => m.x));
  const y1 = Math.min(...currentMarks.map((m) => m.y));
  const x2 = Math.max(...currentMarks.map((m) => m.x + m.w));
  const y2 = Math.max(...currentMarks.map((m) => m.y + m.h));
  const vw = els.boardView.clientWidth - 20;
  const vh = els.boardView.clientHeight - 20;
  const z = Math.max(1, Math.min(3, 0.8 * Math.min(vw / ((x2 - x1) * fitScale), vh / ((y2 - y1) * fitScale))));
  const dx = ((x1 + x2) / 2 - problemImage.w / 2) * fitScale;
  const dy = ((y1 + y2) / 2 - problemImage.h / 2) * fitScale;
  els.frame.style.transform = `translate(${-z * dx}px, ${-z * dy}px) scale(${z})`;
}

els.zoomBtn.addEventListener("click", () => {
  zoomed = !zoomed;
  applyZoom();
});
els.clearMarkBtn.addEventListener("click", () => {
  currentMarks = [];
  drawMarks();
});

// 返事の最後の [[mark x=.. y=.. w=.. h=..]] を読み取る（写真の外にはみ出した分は切る）
function parseMarks(text) {
  if (!problemImage) return [];
  const marks = [];
  for (const [, body] of text.matchAll(/\[\[mark([^\]]*)\]\]/g)) {
    const v = {};
    for (const [, k, n] of body.matchAll(/\b(x|y|w|h)\s*[=:]\s*(-?\d+(?:\.\d+)?)/g)) v[k] = Number(n);
    if (!["x", "y", "w", "h"].every((k) => Number.isFinite(v[k]))) continue;
    const x = Math.max(0, Math.min(problemImage.w, v.x));
    const y = Math.max(0, Math.min(problemImage.h, v.y));
    const w = Math.min(problemImage.w - x, v.w);
    const h = Math.min(problemImage.h - y, v.h);
    if (w > 4 && h > 4) marks.push({ x, y, w, h });
  }
  return marks.slice(0, 2);
}

// 生徒に見せる文・読み上げる文から、目印の行を取りのぞく（書きかけの途中も隠す）

    addBubble("error", { text: "マイクの使用が許可されていません。ブラウザのアドレスバーのマイクのマークから許可してください。" });

});

function startListening() {
  if (!listener.supported || busy || turnsLeft() <= 0) return;

els.form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (busy || turnsLeft() <= 0) return;

  const text = els.input.value.trim();
  if (!text && !pendingImage) {
    setMood("idle", "問題の写真か、質問を入れてね！");
    return;
  }

  listener.stop();
  stopSpeaking();

  // 送る内容を組み立てる（画像 → 文字 の順）。画像の大きさは、枠の座標のために伝える
  const question = text || "この問題が分かりません。教えてください。";
  const content = [];
  if (pendingImage) {
    content.push({
      type: "image",
      source: { type: "base64", media_type: pendingImage.mediaType, data: pendingImage.data },
    });
    content.push({ type: "text", text: `${question}\n（写真の大きさ：幅${pendingImage.w}×高さ${pendingImage.h}ピクセル）` });
  } else {
    content.push({ type: "text", text: question });
  }

  const sentImage = pendingImage;
  const before = { problemImage, sampleProblem };
  if (sentImage) {
    sampleProblem = sentImage.sample;
    showProblem(sentImage);
  }
  messages.push({ role: "user", content });
  addBubble("me", { text: text || "この問題を教えて！", imageUrl: sentImage?.url });
  els.input.value = "";
  clearImage();

  await askPlatz({ restore: { text, image: sentImage, ...before } });
});

async function askPlatz({ restore }) {
  busy = true;
  updateTurns();
  setMood("thinking", "うーん、考え中…");

  const body = addBubble("platz-msg");
  body.classList.add("typing");
  let full = "";
  let finalContent = null;
  let errorMessage = null;
  controller = new AbortController();

  // 描きかえは画面の更新に合わせてまとめて行う（数式の描画が重いため）
  let scheduled = false;
  const redraw = () => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      renderRich(body, cleanText(full));
      els.log.scrollTop = els.log.scrollHeight;
    });
  };

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages, sampleProblem }),
      signal: controller.signal,
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `サーバーエラー (${res.status})`);
    }

    // 届いた分から1行ずつ読む
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "text") {
          if (!full) setMood("thinking", "書いてるよ…");
          full += ev.text;
          redraw();
        } else if (ev.type === "done") {
          finalContent = ev.content;
        } else if (ev.type === "error") {
          errorMessage = ev.message;
        }
      }
    }
    if (!finalContent && !errorMessage) errorMessage = "返事が途中で切れてしまいました。もう一度送ってみてね。";
  } catch (err) {
    if (err.name === "AbortError") return; // 「次の問題へ」で止めたとき
    errorMessage = err.message.startsWith("Failed to fetch")
      ? "サーバーにつながりません。サーバーが起動しているか確認してください。"
      : err.message;
  } finally {
    body.classList.remove("typing");
    controller = null;
    busy = false;
  }

  if (errorMessage) {
    // 失敗した質問は履歴から外し、入力欄に戻してやり直せるようにする
    body.closest(".msg").remove();
    messages.pop();
    els.log.lastElementChild?.remove(); // 自分の吹き出しも消す
    if (!els.log.querySelector(".msg")) els.emptyHint.hidden = false;
    addBubble("error", { text: errorMessage });
    els.input.value = restore.text;
    if (restore.image) {
      pendingImage = restore.image;
      els.previewImg.src = restore.image.url;
      els.preview.hidden = false;
      sampleProblem = restore.sampleProblem;
      if (restore.problemImage) showProblem(restore.problemImage);
      else hideProblem();
    }
    setMood("idle", "ごめんね、うまくいかなかったみたい。");
    updateTurns();
    return;
  }

  // 返事はそのままの形で履歴に残す（中身を書きかえると次の質問でエラーになる）
  messages.push({ role: "assistant", content: finalContent });
  const raw = finalContent
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("");
  const answer = cleanText(raw);
  renderRich(body, answer);

  const marks = parseMarks(raw);
  if (marks.length) {
    currentMarks = marks;
    zoomed = false;
    drawMarks();
    const pin = document.createElement("button");
    pin.type = "button";
    pin.className = "btn pin";
    pin.textContent = "この場所を見る";
    pin.addEventListener("click", () => {
      currentMarks = marks;
      zoomed = false;
      drawMarks();
    });
    body.closest(".msg").append(pin);
  }
  updateTurns();

  if (turnsLeft() <= 0) {
    addBubble("info", { text: `この問題のやり取りは${maxTurns}回までだよ。「次の問題へ」を押してね。` });
  }
  speak(answer);
}

// ---------- ボタン ----------
els.nextBtn.addEventListener("click", () => {
  if (messages.length && !confirm("今の問題の会話を消して、次の問題に進みますか？")) return;
  controller?.abort();
  stopSpeaking();
  listener.stop();
  messages = [];
  busy = false;
  lastSpoken = "";
  sampleProblem = false;
  clearImage();
  hideProblem();
  els.input.value = "";
  els.log.querySelectorAll(".msg").forEach((m) => m.remove());
  els.emptyHint.hidden = false;
  els.replayBtn.disabled = true;
  setMood("idle", "次の問題の写真を見せてね！");
  updateTurns();
  listenIfTalking();
});

els.replayBtn.addEventListener("click", () => speak(lastSpoken));
els.stopBtn.addEventListener("click", () => stopSpeaking());
els.voiceToggle.addEventListener("change", () => {
  if (!els.voiceToggle.checked) stopSpeaking();
});

// ---------- はじめに ----------
fetch("/api/config")
  .then((r) => r.json())
  .then((c) => {
    maxTurns = c.maxTurns;
    if (c.demo) els.title.textContent += "（お試しモード）";
  })
  .catch(() => {})
  .finally(updateTurns);
updateTurns();

</script>
</body>
</html>
