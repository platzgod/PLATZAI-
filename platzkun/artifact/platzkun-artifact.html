<style>
/* Layout: 左に「黒板」（問題の写真を大きく＋いま話している場所にオレンジの枠）とプラッツ君、右に方眼ノートの会話。狭い画面では上下に積む */

  --pencil: #d9772b;     /* 写真ボタン（鉛筆のオレンジ） */
  --me: #fff2e4;         /* 生徒の吹き出し */
  --panel: #ffffff;
  --line: #d6e2cf;
  --warn-bg: #fdecea;
  --warn: #b4382f;
  --hl: rgba(255, 205, 40, .30);  /* 蛍光ペンの黄色 */
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {

    --paper: #171c16; --grid: #243026; --ink: #e8efe4; --muted: #a3b09e;
    --leaf: #7cc16a; --leaf-deep: #9bd78a; --leaf-soft: #22301f; --pencil: #ec9150;
    --me: #3a2a1c; --panel: #1f251d; --line: #34412f; --warn-bg: #3d2220; --warn: #ff9b90;
    --hl: rgba(255, 205, 40, .22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #171c16; --grid: #243026; --ink: #e8efe4; --muted: #a3b09e;
  --leaf: #7cc16a; --leaf-deep: #9bd78a; --leaf-soft: #22301f; --pencil: #ec9150;
  --me: #3a2a1c; --panel: #1f251d; --line: #34412f; --warn-bg: #3d2220; --warn: #ff9b90;

  color-scheme: dark;

html, body { height: 100%; }
body {

  font-family: var(--font-body);

}

  flex: 1;

  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(320px, 1fr);
  grid-template-rows: auto 1fr;
  gap: 14px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---- 上の帯 ---- */
.top {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  flex-wrap: wrap;
}
.top h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.45rem;
  color: var(--leaf-deep);
  text-wrap: balance;
}
.top-tools { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.turns {
  font-size: .9rem;

}

.toggle { font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

  border-radius: 12px;

}

/* ---- 教壇（プラッツ君） ---- */

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  min-height: 0;
}

  position: relative;
  background: var(--panel);
  border: 2px solid var(--leaf);
  border-radius: 18px;
  padding: 10px 16px;
  font-family: var(--font-display);
  font-weight: 500;
  text-align: center;
  max-width: 100%;
}
.say::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -11px;
  transform: translateX(-50%);
  border: 10px solid transparent;
  border-top-color: var(--leaf);
  border-bottom: 0;
}
.platz { width: min(100%, 280px); max-height: 46vh; object-fit: contain; transform-origin: 50% 92%; }
.platz.talking { animation: talk .5s ease-in-out infinite alternate; }
.platz.thinking { animation: think 1.4s ease-in-out infinite; }
@keyframes talk { from { transform: rotate(-3deg); } to { transform: rotate(3deg) scale(1.03); } }
@keyframes think { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@media (prefers-reduced-motion: reduce) {
  .platz.talking, .platz.thinking { animation: none; }
}
.stage-tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* ---- 左の列：問題が来たら、プラッツ君は小さく上に、問題の写真を大きく ---- */
.left { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }

.left.has-problem .say::after {

  border: 10px solid transparent; border-right-color: var(--leaf); border-left: 0;
}
.left.has-problem .stage-tools { flex-direction: column; }

.board {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
}
.board-view {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 10px;
}
.frame { position: relative; transition: transform .45s ease; }
.frame img { display: block; width: 100%; height: 100%; border-radius: 6px; }
.mark {
  position: absolute;
  border: 3px solid var(--pencil);
  background: var(--hl);
  border-radius: 6px;

  pointer-events: none;
}

.board-bar {

  gap: 8px;
  flex-wrap: wrap;

}

.msg img.thumb { display: block; max-width: min(240px, 100%); max-height: 180px; border-radius: 8px; margin-bottom: 6px; }
.msg math[display="block"] { display: block; overflow-x: auto; margin: .35em 0; font-size: 1.15em; }
.msg math { font-size: 1.08em; }
.thinking-dots::after { content: "考え中"; color: var(--muted); animation: dots 1.2s steps(4) infinite; }

.preview { display: flex; align-items: center; gap: 10px; padding: 8px 16px 0; }

  flex-wrap: wrap;

}
.btn-photo { background: var(--pencil); color: var(--panel); display: inline-flex; align-items: center; }
.btn-mic { background: var(--panel); border-color: var(--line); font-size: 1.2rem; padding: 6px 12px; }
.btn-mic.on { background: var(--warn); color: var(--panel); border-color: var(--warn); }
.btn-send { background: var(--leaf); color: var(--panel); min-width: 84px; }

[hidden] { display: none !important; }

@media (max-width: 760px) {

  .board { height: 52vh; flex: none; }
  .left.has-problem .stage-tools { flex-direction: row; }
  .stage { flex-direction: row; flex-wrap: wrap; }
  .platz { width: 130px; }
  .say { flex: 1 1 160px; }
  .say::after { display: none; }
}
</style>

<script>
// =====================================================================
// プラッツ君の解説ルール（Claude に毎回いちばん最初に渡す指示）
// =====================================================================
const RULES = `あなたは学習塾のキャラクター「プラッツ君」です。中学生〜高校生（主に高校生、難関大学の入試レベルまで）の生徒が、分からない問題の写真を見せて質問してきます。教科は数学・英語・国語・理科・社会のどれでもあります。問題の写真は、毎回の質問に添付されます。

## 教え方
- 目的は、生徒が自分の力で解けるようになることです。答えや完成した解き方をすぐに見せず、段階的にヒントを出して生徒に考えさせてください。
- 1回の返事ではヒントを1つだけ出し、最後に生徒が考えるための短い問いかけをしてください。
- ヒントは軽いもの（どこに注目するか・何を思い出すか）から始めて、生徒の反応を見ながら少しずつ具体的にしていきます。
- 生徒の考えが合っていたらしっかりほめ、まちがっていたら、どこで迷ったかを一緒に確かめてください。
- 生徒が「答えだけ教えて」と言っても、まずはヒントを出してください。何度かヒントを出したうえで、生徒が自分で考えた跡があり、それでも行き詰まっているときは、解き方の流れを一緒に確認しながら答えにたどり着いてかまいません。
- 最初の返事では、写真の問題をどう読み取ったかを一言で伝えてください。写真が読み取れない・問題が複数あってどれか分からないときは、推測で進めずに生徒にたずねてください。

## 話し方
- 返事は画面に表示され、同時に音声で読み上げられます。一度に話す量は短く、2〜4文（長くても150字くらい）にしてください。
- 中高生に分かりやすい、やさしくて親しみやすい言葉で話してください。一人称は「ぼく」です。難しい用語には、ひとことで意味をそえてください。
- 見出しや箇条書きは使わず、話しかけるような文章にしてください。強調したい語は **太字** にしてかまいません。
- 数式は必ず LaTeX で書き、文中は $...$ 、独立した式は $$...$$ で囲んでください。
- 英語の問題では、英文や単語はそのまま英語で書いてかまいません。

## 話題の範囲
- 応じるのは、生徒が見せた問題（または入力した問題）と、それを解くために必要な学習内容だけです。
- それ以外の話題には応じず、「ぼくはこの問題のお手伝い係なんだ。問題の話にもどろう！」のように、やさしく問題に話をもどしてください。新しい問題を聞きたいときは「次の問題へ」ボタンを押すよう案内してください。
- まだ問題が見せられていないときは、問題の写真をアップロードするか、問題文を入力するよう案内してください。

ここまでが指示です。このあとから生徒との会話が始まります。プラッツ君として返事だけを書いてください。`;

// 写真があるときだけ足す指示：いま話している場所を写真の上に枠で示すため

## 写真の上の目印
問題の写真は、画面に大きく表示されています。返事のいちばん最後に、いま話している内容に関係する写真の中の場所を、次の形で1行に書いてください。
[[mark x=左端 y=上端 w=幅 h=高さ]]
座標は写真の左上を (0, 0) とするピクセルで、写真の大きさは 幅${w} × 高さ${h} ピクセルです。問題番号・式・図・下線部など、話している部分を少し余裕をもって囲んでください。2か所までなら、1か所ずつ別の行に書けます。特定の場所がないときは [[mark none]] と書いてください。この行は生徒には見えず、枠として表示されます。`;

  els.input.disabled = left() <= 0;

}

// =====================================================================
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function mathHtml(tex, display) {
  if (!window.katex) return esc(display ? `$$${tex}$$` : `$${tex}$`);
  try {
    return katex.renderToString(tex, { displayMode: display, output: "mathml", throwOnError: false });

}
function renderRich(el, text) {
  el.innerHTML = text
    .replace(/\\\[([\s\S]+?)\\\]/g, "$$$$$1$$$$")
    .replace(/\\\(([\s\S]+?)\\\)/g, "$$$1$$")
    .replace(/\n?(\$\$[\s\S]+?\$\$)\n?/g, "$1")
    .split(/(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$)/g)
    .map((part) => {
      if (part.length > 4 && part.startsWith("$$") && part.endsWith("$$")) return mathHtml(part.slice(2, -2), true);
      if (part.length > 2 && part.startsWith("$") && part.endsWith("$")) return mathHtml(part.slice(1, -1), false);
      return esc(part).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
    })
    .join("");
}

function bubble(kind, { text = "", image = null } = {}) {
  const div = document.createElement("div");
  div.className = `msg ${kind}`;
  if (kind === "platz-msg") {
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = "プラッツ君";
    div.append(who);
  }
  if (image) {
    const img = document.createElement("img");
    img.className = "thumb";
    img.alt = "送った問題の画像";
    img.src = image.url;
    div.append(img);
  }
  const body = document.createElement("div");
  body.textContent = text;
  div.append(body);
  els.log.append(div);
  els.log.scrollTop = els.log.scrollHeight;
  return body;
}

// =====================================================================
// 読み上げ
// =====================================================================
const speaker = {
  voice: null, session: 0, onEnd: null,
  ok: "speechSynthesis" in window,
  pick() {
    const voices = speechSynthesis.getVoices().filter((v) => v.lang.replace("_", "-").startsWith("ja"));
    for (const n of VOICE_SETTINGS.preferredVoices) {
      const v = voices.find((x) => x.name.includes(n));
      if (v) return (this.voice = v);
    }
    this.voice = voices[0] || null;
  },
  speak(text, { onStart, onEnd } = {}) {
    this.stop();
    if (!this.ok) return onEnd && onEnd();
    const session = ++this.session;
    // 1文ずつだと文の間が途切れて聞こえるので、100字くらいまでまとめて話す
    // （長すぎると途中で止まるブラウザがあるので、まとめすぎない）
    const sentences = (text.match(/[^。！？!?\n]+[。！？!?]*/g) || []).map((s) => s.trim()).filter(Boolean);
    const parts = [];
    for (const s of sentences) {
      if (parts.length && (parts[parts.length - 1] + s).length <= 100) parts[parts.length - 1] += s;
      else parts.push(s);
    }
    if (!parts.length) return onEnd && onEnd();
    this.onEnd = onEnd;
    onStart && onStart();
    parts.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p);
      u.lang = VOICE_SETTINGS.lang;
      u.rate = VOICE_SETTINGS.rate;
      u.pitch = VOICE_SETTINGS.pitch;
      if (this.voice) u.voice = this.voice;
      if (i === parts.length - 1) u.onend = u.onerror = () => { if (session === this.session) this.finish(); };
      speechSynthesis.speak(u);
    });
  },
  stop() {
    if (!this.ok) return;
    this.session++;
    speechSynthesis.cancel();
    this.finish();
  },
  finish() {
    const cb = this.onEnd;
    this.onEnd = null;
    cb && cb();
  },
};
if (speaker.ok) {
  speaker.pick();
  speechSynthesis.addEventListener("voiceschanged", () => speaker.pick());
}

const WORDS = {
  "\\times": " かける ", "\\div": " わる ", "\\cdot": " かける ", "\\pm": " プラスマイナス ",
  "\\leqq": " 小なりイコール ", "\\geqq": " 大なりイコール ", "\\leq": " 小なりイコール ",
  "\\geq": " 大なりイコール ", "\\le": " 小なりイコール ", "\\ge": " 大なりイコール ",
  "\\neq": " ノットイコール ", "\\approx": " ニアリーイコール ", "\\infty": "無限大",
  "\\pi": "パイ", "\\theta": "シータ", "\\alpha": "アルファ", "\\beta": "ベータ",
  "\\sin": "サイン", "\\cos": "コサイン", "\\tan": "タンジェント", "\\log": "ログ",
  "\\lim": "リミット", "\\sum": "シグマ", "\\int": "インテグラル", "\\angle": "角",
  "\\triangle": "三角形", "\\Rightarrow": " ならば ", "\\circ": "度",
};
function mathToSpeech(tex) {
  let s = tex;
  for (let i = 0; i < 5; i++) {
    s = s
      .replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, " $2 分の $1 ")
      .replace(/\\sqrt\{([^{}]*)\}/g, " ルート $1 ")
      .replace(/\^\{?\\circ\}?/g, "度")
      .replace(/\\(int|sum)_\{?([^{}^\s]+)\}?\^\{?([^{}\s]+)\}?/g, " \\$1 $2 から $3 まで ")
      .replace(/\^\{2\}|\^2/g, " の2乗 ")
      .replace(/\^\{3\}|\^3/g, " の3乗 ")
      .replace(/\^\{([^{}]*)\}/g, " の $1 乗 ")
      .replace(/\^(\w)/g, " の $1 乗 ")
      .replace(/\\(?:text|mathrm|mathbf|vec|overline)\{([^{}]*)\}/g, " $1 ");
  }
  for (const k of Object.keys(WORDS).sort((a, b) => b.length - a.length)) s = s.split(k).join(WORDS[k]);
  return s
    .replace(/\\left|\\right|\\,|\\;|\\!|\\quad|\\ /g, " ")
    .replace(/_\{([^{}]*)\}|_(\w)/g, " $1$2 ")
    .replace(/\\[a-zA-Z]+/g, " ")
    .replace(/[{}]/g, " ")
    .replace(/</g, " 小なり ").replace(/>/g, " 大なり ")
    .replace(/=/g, " イコール ").replace(/\+/g, " プラス ").replace(/[-−]/g, " マイナス ")
    .replace(/\s+/g, " ").trim();
}
function toSpeech(text) {
  return text
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => ` ${mathToSpeech(t)} 。`)
    .replace(/\$([^$\n]+?)\$/g, (_, t) => ` ${mathToSpeech(t)} `)
    .replace(/[*_`#>]/g, "")
    .trim();
}

function speak(text) {
  lastSpoken = text;
  els.replayBtn.disabled = !text;
  if (!els.voiceToggle.checked || !text) return setMood("idle", "考えたことを教えてね！");
  speaker.speak(toSpeech(text), {
    onStart: () => { setMood("talking", "おはなし中…"); els.hushBtn.disabled = false; },
    onEnd: () => {
      setMood("idle", left() > 0 ? "考えたことを教えてね！" : "よくがんばったね！");
      els.hushBtn.disabled = true;
    },
  });
}

// =====================================================================
// 音声入力（この画面ではマイクが使えないことがある）
// =====================================================================
let recognizer = null;
let listening = false;
let before = "";
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognizer = new SR();
  recognizer.lang = "ja-JP";
  recognizer.interimResults = true;
  recognizer.onresult = (e) => {
    let t = "";
    for (const r of e.results) t += r[0].transcript;
    els.input.value = (before ? before + " " : "") + t;
  };
  recognizer.onstart = () => {
    listening = true;
    els.micBtn.classList.add("on");
    setMood("idle", "聞いてるよ…話し終わったら、もう一度🎤を押してね");
  };
  recognizer.onend = () => {
    listening = false;
    els.micBtn.classList.remove("on");
  };
  recognizer.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "network") {
      recognizer = null;
      els.micBtn.hidden = true;
      bubble("note", { text: "この画面ではマイクが使えないみたい。質問は文字で入力してね。（音声入力は、パソコンで直接開くお試し版で試せます）" });
      refresh();
    }
  };
} else {
  els.micBtn.hidden = true;
}
els.micBtn.addEventListener("click", () => {
  if (!recognizer) return;
  if (listening) return recognizer.stop();
  speaker.stop();
  before = els.input.value.trim();
  try { recognizer.start(); } catch { /* すでに起動中 */ }
});

// =====================================================================
// 画像
// =====================================================================
// Claude が見る大きさ（約120万画素）にこちらで縮めておき、その大きさを座標の基準にする
const MAX_PIXELS = 1150000;
async function shrink(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.src = url;
  await img.decode();
  const scale = Math.min(1, Math.sqrt(MAX_PIXELS / (img.naturalWidth * img.naturalHeight)));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(url);
  const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.9));
  return { blob, url: URL.createObjectURL(blob), w, h };
}

async function takeImage(file) {
  if (!file || !file.type.startsWith("image/")) return;
  if (!canSendImages) {
    bubble("warn", { text: "この画面では写真を送れません。問題文を文字で入力してね。" });
    return;
  }
  try {
    pendingImage = await shrink(file);
  } catch {
    bubble("warn", { text: "この写真は開けませんでした。JPEG か PNG の写真でためしてね。" });
    return;
  }
  els.previewImg.src = pendingImage.url;
  els.preview.hidden = false;
  setMood("idle", "写真を受け取ったよ！どこが分からないか教えてね。");
  els.input.focus();
}
function dropImage() {
  pendingImage = null;
  els.preview.hidden = true;
  els.previewImg.removeAttribute("src");
  els.fileInput.value = "";
}
els.fileInput.addEventListener("change", () => takeImage(els.fileInput.files[0]));
els.removeImg.addEventListener("click", dropImage);
document.addEventListener("paste", (e) => {
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find((i) => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); takeImage(item.getAsFile()); }
});
els.notebook.addEventListener("dragover", (e) => { e.preventDefault(); els.notebook.classList.add("drag"); });
els.notebook.addEventListener("dragleave", () => els.notebook.classList.remove("drag"));
els.notebook.addEventListener("drop", (e) => {
  e.preventDefault();
  els.notebook.classList.remove("drag");
  takeImage(e.dataTransfer.files[0]);
});

// =====================================================================
// 黒板：問題の写真を大きく表示し、いま話している場所に枠をつける
// =====================================================================
let currentMarks = []; // [{x, y, w, h}]（写真のピクセル）
let zoomed = false;
let fitScale = 1;

function showProblem(img) {
  els.boardImg.src = img.url;
  els.board.hidden = false;
  els.left.classList.add("has-problem");
  currentMarks = [];
  zoomed = false;
  fitBoard();
  drawMarks();
}
function hideProblem() {
  els.board.hidden = true;
  els.left.classList.remove("has-problem");
  els.boardImg.removeAttribute("src");
  currentMarks = [];
  zoomed = false;
  drawMarks();
}

// 写真を黒板いっぱいに収める
function fitBoard() {
  if (!problemImage || els.board.hidden) return;
  const vw = Math.max(40, els.boardView.clientWidth - 20);
  const vh = Math.max(40, els.boardView.clientHeight - 20);
  fitScale = Math.min(vw / problemImage.w, vh / problemImage.h);
  els.frame.style.width = `${problemImage.w * fitScale}px`;
  els.frame.style.height = `${problemImage.h * fitScale}px`;
  applyZoom();
}
new ResizeObserver(fitBoard).observe(els.boardView);

function drawMarks() {
  els.frame.querySelectorAll(".mark").forEach((m) => m.remove());
  if (problemImage) {
    currentMarks.forEach((m, i) => {
      const box = document.createElement("div");
      box.className = "mark";
      box.style.left = `${(m.x / problemImage.w) * 100}%`;
      box.style.top = `${(m.y / problemImage.h) * 100}%`;
      box.style.width = `${(m.w / problemImage.w) * 100}%`;
      box.style.height = `${(m.h / problemImage.h) * 100}%`;
      const label = document.createElement("span");
      label.textContent = currentMarks.length > 1 ? `ここ ${i + 1}` : "ここ！";
      box.append(label);
      els.frame.append(box);
    });
  }
  els.zoomBtn.disabled = !currentMarks.length;
  els.clearMarkBtn.disabled = !currentMarks.length;
  if (!currentMarks.length) zoomed = false;
  applyZoom();
}

// 枠の所を拡大：枠の中心が黒板の真ん中に来るように、写真を拡大してずらす
function applyZoom() {
  els.zoomBtn.textContent = zoomed ? "全体を見る" : "枠の所を拡大";
  if (!zoomed || !currentMarks.length || !problemImage) {
    els.frame.style.transform = "";
    return;
  }
  const x1 = Math.min(...currentMarks.map((m) => m.x));
  const y1 = Math.min(...currentMarks.map((m) => m.y));
  const x2 = Math.max(...currentMarks.map((m) => m.x + m.w));
  const y2 = Math.max(...currentMarks.map((m) => m.y + m.h));
  const vw = els.boardView.clientWidth - 20;
  const vh = els.boardView.clientHeight - 20;
  const z = Math.max(1, Math.min(3, 0.8 * Math.min(vw / ((x2 - x1) * fitScale), vh / ((y2 - y1) * fitScale))));
  const dx = ((x1 + x2) / 2 - problemImage.w / 2) * fitScale;
  const dy = ((y1 + y2) / 2 - problemImage.h / 2) * fitScale;
  els.frame.style.transform = `translate(${-z * dx}px, ${-z * dy}px) scale(${z})`;
}

els.zoomBtn.addEventListener("click", () => { zoomed = !zoomed; applyZoom(); });
els.clearMarkBtn.addEventListener("click", () => { currentMarks = []; drawMarks(); });

// 返事の最後の [[mark x=.. y=.. w=.. h=..]] を読み取る（写真の外にはみ出した分は切る）
function parseMarks(text) {
  if (!problemImage) return [];
  const marks = [];
  for (const [, body] of text.matchAll(/\[\[mark([^\]]*)\]\]/g)) {
    const v = {};
    for (const [, k, n] of body.matchAll(/\b(x|y|w|h)\s*[=:]\s*(-?\d+(?:\.\d+)?)/g)) v[k] = Number(n);
    if (!["x", "y", "w", "h"].every((k) => Number.isFinite(v[k]))) continue;
    const x = Math.max(0, Math.min(problemImage.w, v.x));
    const y = Math.max(0, Math.min(problemImage.h, v.y));
    const w = Math.min(problemImage.w - x, v.w);
    const h = Math.min(problemImage.h - y, v.h);
    if (w > 4 && h > 4) marks.push({ x, y, w, h });
  }
  return marks.slice(0, 2);
}
// 生徒に見せる文から目印の行を取りのぞく（書きかけの途中も隠す）
const cleanText = (text) => text.replace(/\[\[[^\]]*\]\]/g, "").replace(/\[\[?[^\]]*$/, "").trimEnd();

// =====================================================================
// 送信 → Claude に聞く
// =====================================================================
const ERRORS = {
  not_granted: "プラッツ君が Claude を使うことが許可されていません。ページを開き直して「許可」を選んでください。",
  sampling_disabled: "このアカウントでは Claude を使えません。",
  rate_limited: "今は使える回数の上限に来ています。しばらく待ってから、もう一度送ってね。",
  session_expired: "ログインが切れました。claude.ai にログインし直してください。",
  image_rejected: "この写真は送れませんでした。別の写真（JPEG か PNG）でためしてね。",
  images_unavailable: "この画面では写真を送れません。問題文を文字で入力してね。",
  refused: "ごめんね、この内容にはお答えできません。問題について聞いてみてね。",
  empty_completion: "うまく返事が作れませんでした。聞き方を少し変えて、もう一度送ってね。",
  prompt_too_large: "会話が長くなりすぎました。「次の問題へ」を押して、新しく始めてね。",
};

els.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    els.form.requestSubmit();
  }
});

els.form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (busy || left() <= 0 || !ready) return;
  const text = els.input.value.trim();
  if (!text && !pendingImage) return setMood("idle", "問題の写真か、質問を入れてね！");

  if (listening) recognizer.stop();
  speaker.stop();

  const img = pendingImage;
  if (img) {
    problemImage = img; // この問題の写真として、以後のやり取りでも毎回送る
    showProblem(img);
  }
  const content = text || "この問題が分かりません。教えてください。";
  turns.push({ role: "user", content });
  bubble("me", { text: text || "この問題を教えて！", image: img });
  els.input.value = "";
  dropImage();

  busy = true;
  refresh();
  setMood("thinking", "うーん、考え中…");
  const body = bubble("platz-msg");
  body.classList.add("thinking-dots");
  ctl = new AbortController();

  const options = {
    cache: false,
    signal: ctl.signal,
    onText: ({ text: t }) => {
      body.classList.remove("thinking-dots");
      setMood("thinking", "書いてるよ…");
      renderRich(body, cleanText(t));
      els.log.scrollTop = els.log.scrollHeight;
    },
  };
  if (problemImage) options.images = [problemImage.blob];
  const rules = RULES + (problemImage ? markRules(problemImage.w, problemImage.h) : "");

  try {
    const { text: raw, truncated } = await sample([{ role: "user", content: rules }, ...turns], options);
    const answer = cleanText(raw);
    renderRich(body, answer);
    turns.push({ role: "assistant", content: raw }); // 目印の行も残す（次の返事でも同じ書き方を続けるため）
    const marks = parseMarks(raw);
    if (marks.length) {
      currentMarks = marks;
      zoomed = false;
      drawMarks();
      const pin = document.createElement("button");
      pin.type = "button";
      pin.className = "btn-ghost pin";
      pin.textContent = "この場所を見る";
      pin.addEventListener("click", () => { currentMarks = marks; zoomed = false; drawMarks(); });
      body.closest(".msg").append(pin);
    }
    if (truncated) bubble("note", { text: "返事が途中で切れました。続きは「続きを教えて」と送ってね。" });
    if (left() <= 0) bubble("note", { text: `この問題のやり取りは${MAX_TURNS}回までだよ。「次の問題へ」を押してね。` });
    speak(answer);
  } catch (err) {
    turns.pop(); // 失敗した質問は数えない
    const partial = err && err.code !== "refused" ? err.text : "";
    if (partial) {
      renderRich(body, cleanText(partial));
    } else {
      body.closest(".msg").remove();
    }
    if (!err || err.code !== "cancelled") {
      bubble("warn", { text: ERRORS[err && err.code] || "通信がうまくいきませんでした。少し待ってから、もう一度送ってね。" });
      if (!partial) els.input.value = text;
      if (err && (err.code === "not_granted" || err.code === "sampling_disabled")) ready = false;
    }
    setMood("idle", "ごめんね、うまくいかなかったみたい。");
  } finally {
    busy = false;
    ctl = null;
    refresh();
  }
});

els.stopBtn.addEventListener("click", () => ctl && ctl.abort());

// =====================================================================
// ボタン
// =====================================================================
let armTimer = null;
els.nextBtn.addEventListener("click", () => {
  // 会話があるときは、2回押して確定（うっかり消さないように）
  if (turns.length && !els.nextBtn.classList.contains("armed")) {
    els.nextBtn.classList.add("armed");
    els.nextBtn.textContent = "もう一度押すと会話を消します";
    clearTimeout(armTimer);
    armTimer = setTimeout(() => {
      els.nextBtn.classList.remove("armed");
      els.nextBtn.textContent = "次の問題へ";
    }, 3000);
    return;
  }
  clearTimeout(armTimer);
  els.nextBtn.classList.remove("armed");
  els.nextBtn.textContent = "次の問題へ";
  if (ctl) ctl.abort();
  speaker.stop();
  if (listening) recognizer.stop();
  turns = [];
  problemImage = null;
  hideProblem();
  lastSpoken = "";
  dropImage();
  els.input.value = "";
  [...els.log.querySelectorAll(".msg")].slice(1).forEach((m) => m.remove());
  els.replayBtn.disabled = true;
  setMood("idle", "次の問題の写真を見せてね！");
  refresh();
});
els.replayBtn.addEventListener("click", () => speak(lastSpoken));
els.hushBtn.addEventListener("click", () => speaker.stop());
els.voiceToggle.addEventListener("change", () => { if (!els.voiceToggle.checked) speaker.stop(); });

// =====================================================================
// はじめに：Claude が使えるか確かめる
// =====================================================================
refresh();
(async () => {
  sample = window.claude ? await window.claude.use("sample") : null;
  if (!sample) {
    bubble("warn", { text: "この画面では Claude につながりません。claude.ai でこのページを開いてください。" });
    setMood("idle", "claude.ai で開いてね");
    return;
  }
  const limits = await sample.limits().catch(() => null);
  canSendImages = Boolean(limits && limits.images);
  if (!canSendImages) {
    els.fileInput.disabled = true;
    document.querySelector(".btn-photo").hidden = true;
    bubble("note", { text: "この画面では写真を送れないので、問題文を文字で入力してね。" });
  }
  ready = true;
  refresh();
})();
</script>
